<title>عَيْنُ الفَصَاحَة | AYN AL-FUSHA — مركز تعليم اللغة العربية الفصحى</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{--navy:#1A1008;--navy2:#2B1D0E;--gold:#CCA854;--gold2:#E8CB80;--bg:#F6EEDA;--card:#FFFBF0;--text:#2A1E12;--mut:#6E5F4B;--line:#E3D5B3;
--serif:'Amiri','Traditional Arabic',serif;--sans:'IBM Plex Sans Arabic',Tahoma,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110A;--card:#241A10;--text:#F2EBD9;--mut:#B3A68F;--line:#3A2B19}}
:root[data-theme="dark"]{--bg:#17110A;--card:#241A10;--text:#F2EBD9;--mut:#B3A68F;--line:#3A2B19}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.8;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--serif);line-height:1.35;font-weight:700}
.w{max-width:1080px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);border-bottom:1px solid rgba(204,168,84,.25)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:var(--serif);font-size:26px;color:var(--gold2);display:flex;align-items:center;gap:8px}.logo img{height:50px;width:auto}
.logo small{font:500 11px var(--sans);color:var(--gold);letter-spacing:1.5px;direction:ltr}@media(max-width:520px){.logo small{display:none}}
nav{display:flex;gap:4px;align-items:center}
nav a{color:#E6DBC4;padding:6px 12px;border-radius:8px;font-size:15px}
nav a:hover,nav a.on{color:var(--gold2);background:rgba(204,168,84,.12)}
nav a.cta{background:var(--gold);color:var(--navy);font-weight:600}
#mb{display:none;background:none;border:1px solid var(--gold);color:var(--gold2);border-radius:8px;padding:6px 12px;font:inherit}
@media(max-width:820px){#mb{display:block}nav{display:none;position:absolute;top:64px;inset-inline:0;background:var(--navy);flex-direction:column;align-items:stretch;padding:12px 20px 20px}nav.open{display:flex}nav a{padding:12px}}
.hero{background:radial-gradient(ellipse at 28% 45%,#3F2D15 0%,var(--navy) 68%);color:#F6EEDA;overflow:hidden;position:relative}
.hero .w{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:center;padding-top:56px;padding-bottom:64px}
.hero h1{font-family:'Aref Ruqaa',var(--serif);line-height:1.6;font-size:clamp(38px,6.5vw,66px);color:var(--gold2)}
.hero p{color:#CDBFA3;max-width:520px;margin:16px 0 28px;font-size:18px}
.rings{width:100%;max-width:360px;justify-self:center}
.rings circle{fill:none;stroke:var(--gold);transform-origin:50% 50%}
@media(prefers-reduced-motion:no-preference){.rings circle{animation:rp 2.4s cubic-bezier(.2,.7,.2,1) both}.rings circle:nth-child(2){animation-delay:.25s}.rings circle:nth-child(3){animation-delay:.5s}.rings circle:nth-child(4){animation-delay:.75s}.rings circle:nth-child(5){animation-delay:1s}}
@keyframes rp{from{transform:scale(.1);opacity:0}to{transform:scale(1)}}
@media(max-width:820px){.hero .w{grid-template-columns:1fr}.rings{max-width:220px;order:-1}.lg{max-width:270px;order:-1}}
.lg{width:100%;max-width:430px;height:auto;justify-self:center;filter:drop-shadow(0 18px 28px rgba(0,0,0,.45))}@media(prefers-reduced-motion:no-preference){.lg{animation:fi 1.4s ease both}}@keyframes fi{from{opacity:0;transform:scale(.95)}}
.btn{display:inline-block;border:0;cursor:pointer;font:600 16px var(--sans);padding:12px 26px;border-radius:10px;background:var(--gold);color:var(--navy);transition:transform .2s,background .2s}
.btn:hover{background:var(--gold2);transform:translateY(-2px)}
.btn.o{background:none;border:1px solid var(--gold);color:var(--gold2);margin-inline-start:10px}
.btn.o:hover{background:rgba(204,168,84,.15)}
section{padding:60px 0}
.alt{background:var(--navy);color:#F6EEDA}.alt h2{color:var(--gold2)}.alt .mut{color:#C2B59B}
.sh{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px;gap:12px;flex-wrap:wrap}
h2{font-size:clamp(28px,4vw,40px)}
.mut{color:var(--mut)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 22px rgba(60,40,10,.07);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 34px rgba(60,40,10,.16)}
.cv{height:140px;position:relative;display:flex;align-items:flex-end;padding:12px}
.cv svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:relative;background:rgba(26,16,8,.8);color:var(--gold2);font-size:13px;padding:2px 12px;border-radius:99px}
.cb{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{font-size:22px}
.meta{display:flex;gap:14px;font-size:14px;color:var(--mut);margin-top:auto;padding-top:8px}
.path{padding:24px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold)}
.path .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:none;color:var(--text);font:500 14px var(--sans);padding:5px 14px;border-radius:99px;cursor:pointer}
.chip:hover,.chip.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.pg{background:var(--navy);color:#F6EEDA;padding:48px 0}
.pg h1{font-size:clamp(34px,5vw,52px);color:var(--gold2)}.pg p{color:#CDBFA3;max-width:600px}
.av{width:84px;height:84px;border-radius:50%;border:2px solid var(--gold);background:var(--navy2);color:var(--gold2);font:700 34px var(--serif);display:grid;place-items:center;margin-bottom:8px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:1fr}}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
.side{position:sticky;top:90px;padding:24px;background:var(--card);border:1px solid var(--gold);border-radius:16px}
.side li{list-style:none;padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between}
.pb{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:var(--gold);transition:width .5s}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.st b{display:block;font:700 34px var(--serif);color:var(--gold)}
input,textarea{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:12px}
input:focus,textarea:focus,.btn:focus-visible,.chip:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px}
.chip{min-height:40px;display:inline-flex;align-items:center}
nav a{min-height:44px;display:flex;align-items:center}
label{display:block;font-weight:600;margin-bottom:12px}label input,label textarea{margin:6px 0 2px;font-weight:400}
.err{display:block;color:#C2543A;margin:-4px 0 10px}.err:empty{display:none}
.note{background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:16px;margin-bottom:16px}
.ok{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:24px;text-align:center}
.pr{color:var(--gold);font-weight:600}.fr{color:#4C8B5A;font-weight:600}
.chs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-bottom:36px}
.ch{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);background:var(--card);border-radius:16px;min-height:64px}
.ch svg{width:28px;height:28px;flex:none;color:var(--gold);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
a.ch:hover{border-color:var(--gold)}.ch.off{border-style:dashed;opacity:.75}.ch small{display:block;color:var(--mut)}
#fw{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.3)}
#fw svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.back{display:inline-block;color:var(--gold2);font-size:14px;margin-bottom:8px;padding:8px 0}
.srch{max-width:520px;margin-bottom:16px}
.sel-g{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.sel-g b{font-size:14px;color:var(--mut);margin-inline-end:4px}
footer{background:var(--navy);color:#B3A68F;text-align:center;padding:36px 20px;font-size:14px}
footer b{font:700 24px var(--serif);color:var(--gold2);display:block}
.quote{font:400 clamp(24px,3.5vw,36px)/1.7 var(--serif);max-width:760px;margin:auto;text-align:center}
.empty{text-align:center;padding:40px;border:1px dashed var(--gold);border-radius:16px}
</style>
</head>

instructors:()=>head('المدربون','خبراء يشاركونك تجربتهم بأسلوب بسيط وعملي.')+`<section><div class="w grid">${I.map(x=>`<div class="path"><div class="av">${x[0].split(' ')[1][0]}</div><h3>${x[0]}</h3><p style="color:var(--gold)">${x[1]}</p><p class="mut">${x[2]}</p></div>`).join('')}</div></section>`,
about:()=>head('عن عَيْنِ الفَصَاحَة','رسالتنا أن نُحيي الفصحى على ألسنة المتعلّمين: نطقًا وكتابةً وفهمًا.')+`<section><div class="w grid"><div class="path"><h3>رسالتنا</h3><p class="mut">نقدّم محتوى عربيًا بجودة عالمية، يقرّب الفصحى من المتعلّم ويجعلها لغة حيّة في كلامه وكتابته.</p></div><div class="path"><h3>رؤيتنا</h3><p class="mut">أن تصبح عَيْنُ الفَصَاحَة المنصة العربية الأولى لمن يريد إتقان الفصحى بلا تعقيد.</p></div><div class="path"><h3>قيمنا</h3><p class="mut">الوضوح، الإتقان، واحترام وقت المتعلّم وعقله.</p></div></div></section>`,
contact:()=>{const L=CFG.links,ch=[['whatsapp','واتساب الأكاديمية'],['facebook','صفحة فيسبوك'],['instagram','حساب إنستغرام'],['youtube','قناة يوتيوب'],['email','البريد الإلكتروني الرسمي'],['phone','رقم الهاتف']].map(([k,l])=>[k,l,href(k,L[k])]).concat(CFG.extra.map(x=>['link',x[0],x[1]]));
return head('تواصل مع أكاديمية عَيْنُ الفَصَاحَة','اختر الطريقة الأنسب لك، أو اكتب لنا من النموذج.')+`<section><div class="w"><div class="chs">${ch.map(([k,l,u])=>{const ic=`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;return u?`<a class="ch" href="${u}" ${u[0]==='h'?'target="_blank" rel="noopener"':''}>${ic}<span>${l}</span></a>`:`<div class="ch off">${ic}<span>${l}<small>سيُضاف قريبًا</small></span></div>`}).join('')}</div><h2 style="margin-bottom:16px">أرسل لنا رسالة</h2><div id="cf" style="max-width:600px">${fld('cn','الاسم','اسمك الكامل')}${fld('ce','البريد الإلكتروني','name@example.com','email')}${fld('cs','الموضوع','موضوع رسالتك')}<label>الرسالة<textarea id="cm" rows="5"></textarea></label><small class="err" id="e-cm"></small><button class="btn" style="width:100%" data-cs>إرسال الرسالة</button><p id="st" role="status" class="mut" style="margin-top:12px"></p></div></div></section>`},
student:()=>{const R=S.r||[],P2=S.p||{},av=R.length?Math.round(R.reduce((s,x)=>s+(P2[x.n]||0),0)/R.length):0;return head('منطقة الطالب','تابع طلبات اشتراكك على هذا الجهاز.')+`<section><div class="w"><div class="note"><b>ملاحظة:</b> لا يوجد نظام حسابات بعد. الطلبات والتقدّم محفوظة في هذا الجهاز فقط، وهذه الصفحة معاينة تجريبية للوحة الطالب.</div><div class="st"><div><b>${R.length}</b>طلب اشتراك</div><div><b>${av}%</b>متوسط التقدّم</div><div><b>${R.filter(x=>(P2[x.n]||0)>=100).length}</b>مكتمل</div></div><h2 style="margin-bottom:20px">كورساتي</h2>${R.length?`<div class="grid">${R.map(x=>{const c=C[x.n],p=P2[x.n]||0;return `<div class="card"><div class="cb"><h3>${c.t}</h3><p class="mut">${x.s==='sent'?'تم إرسال الطلب':'محفوظ على جهازك ولم يُرسل بعد'}${c.p?' · لم يتم الدفع':''}</p><div class="pb"><i style="width:${p}%"></i></div><p class="mut">${p}% مكتمل (تجريبي)</p><button class="btn" data-p="${x.n}">${p>=100?'أعد المراجعة':'أكمل درسًا'}</button></div></div>`}).join('')}</div>`:`<div class="empty"><h3>لا توجد طلبات بعد</h3><p class="mut" style="margin:8px 0 16px">اختر كورسًا واضغط «اشترك الآن» ليظهر هنا.</p><a class="btn" href="#courses">تصفّح الكورسات</a></div>`}</div></section>`}};
const detail=n=>{const c=C[n],x=I[c.i];return `<div class="pg"><div class="w"><a class="back" href="#courses">العودة إلى الكورسات</a><span class="chip on">${c.c}</span><h1 style="margin-top:12px">${c.t}</h1><p>${c.d}</p></div></div><section><div class="w two"><div><h2 style="margin-bottom:12px">أهداف الكورس</h2><ul style="padding-inline-start:22px;margin-bottom:28px">${c.g.map(g=>`<li>${g}</li>`).join('')}</ul><h2 style="margin-bottom:16px">محتوى الكورس</h2>${c.s.map((s,k)=>`<details><summary>الدرس ${k+1}: ${s}</summary><p class="mut" style="margin-top:8px">شرح عملي مع تمرين تطبيقي قصير في نهاية الدرس.</p></details>`).join('')}</div><div class="side"><h3 style="margin-bottom:8px">${x[0]}</h3><p class="mut">${x[1]}</p><ul style="margin:14px 0"><li><span>المستوى</span><b>${c.l}</b></li><li><span>المدة</span><b>${c.h} ساعة</b></li><li><span>الدروس</span><b>${c.s.length}</b></li><li><span>السعر</span><b>${c.p?c.p+' '+CFG.cur:'مجاني'}</b></li></ul>${c.p?'<p class="mut" style="font-size:13px;margin-bottom:10px">السعر تجريبي ويُعدَّل لاحقًا.</p>':''}<a class="btn" style="width:100%" href="#enroll-${n}">اشترك الآن</a></div></div></section>`};
const enrollPg=n=>{const c=C[n];return head('الاشتراك في الكورس',c.t)+`<section><div class="w" style="max-width:600px"><div id="fm"><div class="note"><b>${c.t}</b><br>${c.l} · ${c.h} ساعة · ${c.p?c.p+' '+CFG.cur+' (سعر تجريبي)':'مجاني'}</div>${fld('fn','الاسم الكامل','اسمك الكامل')}${fld('fe','البريد الإلكتروني','name@example.com','email')}${fld('fp',c.p?'رقم الهاتف':'رقم الهاتف (اختياري)','+20 100 000 0000','tel')}${c.p?'<div class="note"><b>الدفع الإلكتروني</b><p class="mut">لم تُربط بوابة دفع بعد، ولن يُخصم منك أي مبلغ الآن. يُرسل طلبك أولًا، ثم تتفق معك الأكاديمية على طريقة الدفع.</p><button class="btn" disabled style="opacity:.5;width:100%">الدفع الإلكتروني — قريبًا</button></div>':''}<button class="btn" style="width:100%" data-sub="${n}">إرسال طلب الاشتراك</button><p id="st" role="status" class="mut" style="margin-top:12px"></p></div></div></section>`};
const LBL={course:'الكورس',name:'الاسم',email:'البريد',phone:'الهاتف',subject:'الموضوع',message:'الرسالة'};
const body=f=>Object.entries(f).filter(x=>x[1]).map(x=>LBL[x[0]]+': '+x[1]).join('\n');
async function deliver(subject,f){if(!CFG.endpoint)return'unsent';try{const r=await fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({subject,...f})});return r.ok?'sent':'fail'}catch(e){return'fail'}}
function result(r,subj,f){const L=CFG.links,wa=href('whatsapp',L.whatsapp),ml=L.email;
if(r==='sent')return `<div class="ok"><h3>تم استلام طلبك</h3><p class="mut" style="margin:8px 0 16px">وصلت رسالتك إلى الأكاديمية، وسنتواصل معك على بريدك الإلكتروني.</p><a class="btn" href="#home">العودة إلى الرئيسية</a></div>`;
return `<div class="note"><h3>لم يُرسل الطلب بعد</h3><p>الموقع غير مربوط بنظام استقبال حتى الآن، لذلك لم يصل طلبك إلى الأكاديمية. ${wa||ml?'يمكنك إرساله الآن من هنا:':'أضيفي واتساب الأكاديمية أو بريدها أو رابط الاستقبال في قسم الإعدادات CFG أعلى الكود، ثم أعيدي المحاولة.'}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">${wa?`<a class="btn" target="_blank" rel="noopener" href="${wa}?text=${encodeURIComponent(subj+'\n'+body(f))}">إرسال عبر واتساب</a>`:''}${ml?`<a class="btn" href="mailto:${ml}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body(f))}">إرسال عبر البريد</a>`:''}</div></div>`}
function chk(rules){let ok=true;rules.forEach(([k,bad,msg])=>{$('e-'+k).textContent=bad?msg:'';if(bad)ok=false});return ok}
const val=id=>$(id).value.trim(),mailRe=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
async function subEnroll(n,b){const c=C[n],ph=val('fp').replace(/[\s-]/g,'');
if(!chk([['fn',val('fn').length<3,'اكتب اسمك الكامل (3 أحرف على الأقل).'],['fe',!mailRe.test(val('fe')),'اكتب بريدًا إلكترونيًا صحيحًا مثل name@example.com'],['fp',(c.p||ph)&&!/^\+?\d{8,15}$/.test(ph),c.p?'رقم الهاتف مطلوب للكورسات المدفوعة (أرقام فقط).':'رقم الهاتف غير صحيح.']]))return;
b.disabled=true;b.textContent='جاري الإرسال...';const f={course:c.t,name:val('fn'),email:val('fe'),phone:ph},subj='طلب اشتراك: '+c.t,r=await deliver(subj,f);
if(r==='fail'){b.disabled=false;b.textContent='إرسال طلب الاشتراك';$('st').textContent='تعذّر الإرسال. تأكد من اتصالك بالإنترنت وحاول مرة أخرى.';return}
S.r=(S.r||[]).filter(x=>x.n!==n);S.r.push({n,s:r});S.p=S.p||{};S.p[n]=S.p[n]||0;sv();$('fm').innerHTML=result(r,subj,f)}
async function subContact(b){
if(!chk([['cn',val('cn').length<3,'اكتب اسمك (3 أحرف على الأقل).'],['ce',!mailRe.test(val('ce')),'اكتب بريدًا إلكترونيًا صحيحًا.'],['cs',val('cs').length<3,'اكتب موضوع الرسالة.'],['cm',val('cm').length<10,'اكتب رسالة من 10 أحرف على الأقل.']]))return;
b.disabled=true;b.textContent='جاري الإرسال...';const f={name:val('cn'),email:val('ce'),subject:val('cs'),message:val('cm')},r=await deliver('رسالة من الموقع: '+f.subject,f);
if(r==='fail'){b.disabled=false;b.textContent='إرسال الرسالة';$('st').textContent='تعذّر الإرسال. تأكد من اتصالك بالإنترنت وحاول مرة أخرى.';return}
$('cf').innerHTML=result(r,'رسالة من الموقع: '+f.subject,f)}
function go(){const h=location.hash.slice(1)||'home',m=h.match(/^(course|enroll)-(\d+)$/);let html,k=h;
if(m&&C[m[2]]){html=(m[1]==='course'?detail:enrollPg)(+m[2]);k='courses'}else html=(pages[h]||pages.home)();
$('app').innerHTML=html;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===k));$('nv').classList.remove('open');window.scrollTo(0,0)}
addEventListener('hashchange',go);go();
$('hl').src=LOGO;
{const w=href('whatsapp',CFG.links.whatsapp);if(w){$('fw').href=w;$('fw').target='_blank';$('fw').rel='noopener'}}
$('mb').onclick=()=>$('nv').classList.toggle('open');
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;$('cg').innerHTML=cl()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-f],[data-lv],[data-pr],[data-p],[data-sub],[data-cs]');if(!t)return;const d=t.dataset;
if(d.f!==undefined){F=d.f;go()}else if(d.lv!==undefined){LV=d.lv;go()}else if(d.pr!==undefined){PR=d.pr;go()}
else if(d.p!==undefined){S.p[d.p]=Math.min(100,(S.p[d.p]||0)+25);sv();go()}
else if(d.sub!==undefined)subEnroll(+d.sub,t);else subContact(t)});
</script>
</body>
</html>
